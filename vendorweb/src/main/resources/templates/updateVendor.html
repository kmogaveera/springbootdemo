<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Update Vendor</title>
<link rel="stylesheet" href="css/styles.css">

</head>
<body>
	<h1>Update Vendor</h1>

<form action="updateVend" method="post">
<pre>
Id: <input type="text" name="id" th:value="${vendor.id}" readonly/>
Code: <input type="text" name="code" th:value="${vendor.code}"/>
Name: <input type="text" name="name" th:value="${vendor.name}"/>
type: <input type="text" name="type" th:value="${vendor.type}"/>
email: <input type="text" name="type" th:value="${vendor.email}"/>
phone: <input type="text" name="type" th:value="${vendor.phone}"/>
address: <input type="text" name="type" th:value="${vendor.address}"/>

<input type="submit" value="save"/>
</pre>
</form>

</body>
</html>
